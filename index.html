      const KELAS_RASMI = EMBEDDED.kelasRasmi;

      function loadKey(k, fallback) {
        try {
          const raw = localStorage.getItem(k);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          if (Array.isArray(fallback)) return Array.isArray(parsed) && parsed.length > 0 ? parsed : fallback;
          return parsed || fallback;
        } catch (e) { return fallback; }
      }

      const state = {
        tab: 'dashboard',
        mobileOpen: false,
        isLoggedIn: false,
        gateError: '',
        profile: loadKey('krsm_school_profile', EMBEDDED.profile),
        admins: loadKey('krsm_admin_accounts', EMBEDDED.admins),
        currentUserId: localStorage.getItem('krsm_current_user_id') || (EMBEDDED.admins[0] ? EMBEDDED.admins[0].id : 'adm-super-1'),
        ahli: loadKey('krsm_ahli_list', EMBEDDED.ahli),
        perjumpaan: loadKey('krsm_perjumpaan_list', EMBEDDED.perjumpaan),
        kehadiran: loadKey('krsm_kehadiran_records', EMBEDDED.kehadiran),
        laporan: loadKey('krsm_laporan_list', EMBEDDED.laporan),
        takwim: loadKey('krsm_takwim_list', EMBEDDED.takwim),
        pencapaian: loadKey('krsm_pencapaian_list', EMBEDDED.pencapaian),
        selectedPjpId: (EMBEDDED.perjumpaan[0] && EMBEDDED.perjumpaan[0].id) || 'pjp-1',
        selectedKelas: 'SEMUA',
        selectedPlatun: 'SEMUA',
        searchAhli: '',
        sijilAhliId: null,
        printLapId: null,
        editAhliId: null,
        editAdminId: null,
        loginModalOpen: false,
        loginError: ''
      };

      function saveAll() {
        localStorage.setItem('krsm_school_profile', JSON.stringify(state.profile));
        localStorage.setItem('krsm_admin_accounts', JSON.stringify(state.admins));
        localStorage.setItem('krsm_current_user_id', state.currentUserId);
        localStorage.setItem('krsm_ahli_list', JSON.stringify(state.ahli));
        localStorage.setItem('krsm_perjumpaan_list', JSON.stringify(state.perjumpaan));
        localStorage.setItem('krsm_kehadiran_records', JSON.stringify(state.kehadiran));
        localStorage.setItem('krsm_laporan_list', JSON.stringify(state.laporan));
        localStorage.setItem('krsm_takwim_list', JSON.stringify(state.takwim));
        localStorage.setItem('krsm_pencapaian_list', JSON.stringify(state.pencapaian));
      }

      function esc(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function fmtDate(d) {
        if (!d) return '—';
        const p = d.split('-');
        if (p.length !== 3) return d;
        const b = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
        return parseInt(p[2],10) + ' ' + (b[parseInt(p[1],10)-1] || p[1]) + ' ' + p[0];
      }

      function currentUser() {
        return state.admins.find(u => u.id === state.currentUserId) || state.admins[0] || { nama: 'Super Admin 1', peranan: 'Super Admin', pin: '1234' };
      }

      function markahJawatan(j) {
        if (j === 'Pengerusi') return 10;
        if (j === 'Naib Pengerusi') return 8;
        if (j === 'Setiausaha' || j === 'Bendahari') return 7;
        if (j === 'AJK') return 5;
        return 3;
      }

      window.appAction = {
        gateLogin(e) {
          e.preventDefault();
          const selId = document.getElementById('gate-user-id').value;
          const pinVal = document.getElementById('gate-pin-input').value.trim();
          const target = state.admins.find(u => u.id === selId);
          if (!target) return;
          if (pinVal === String(target.pin)) {
            state.currentUserId = target.id;
            state.isLoggedIn = true;
            state.gateError = '';
            saveAll(); render();
          } else {
            state.gateError = 'PIN tidak sah. Sila masukkan PIN yang betul.';
            render();
          }
        },
        logout() {
          state.isLoggedIn = false;
          state.loginModalOpen = false;
          render();
        },
        setTab(t) { state.tab = t; state.mobileOpen = false; render(); },
        toggleMobile() { state.mobileOpen = !state.mobileOpen; render(); },
        selectPjp(id) { state.selectedPjpId = id; render(); },
        selectKelas(k) { state.selectedKelas = k; render(); },
        selectPlatun(p) { state.selectedPlatun = p; render(); },
        setSearch(v) { state.searchAhli = v; render(); },
        openEditAhli(id) { state.editAhliId = id; render(); },
        closeEditAhli() { state.editAhliId = null; render(); },
        saveEditAhli(e) {
          e.preventDefault();
          const id = state.editAhliId;
          const kls = document.getElementById('ea-kelas').value;
          const kObj = KELAS_RASMI.find(x => x.nama === kls);
          state.ahli = state.ahli.map(a => a.id === id ? Object.assign({}, a, {
            no_keahlian: document.getElementById('ea-no').value,
            nama_penuh: document.getElementById('ea-nama').value,
            no_kp: document.getElementById('ea-kp').value,
            kelas: kls,
            tingkatan: kObj ? kObj.tingkatan : 1,
            jantina: document.getElementById('ea-platun').value,
            pangkat: document.getElementById('ea-pangkat').value,
            jawatan: document.getElementById('ea-jawatan').value
          }) : a);
          state.editAhliId = null;
          saveAll(); render();
        },
        exportAhliCSV() {
          const headers = ['No Keahlian','Nama Penuh','No KP','Tingkatan','Kelas','Platun','Pangkat','Jawatan'];
          const rows = state.ahli.map(a => [a.no_keahlian, '"' + a.nama_penuh + '"', a.no_kp, a.tingkatan, a.kelas, a.jantina, a.pangkat, a.jawatan]);
          const csv = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
          const link = document.createElement('a');
          link.setAttribute('href', encodeURI(csv));
          link.setAttribute('download', 'Senarai_Ahli_DigitalKrsmSMAI_' + new Date().toISOString().slice(0,10) + '.csv');
          document.body.appendChild(link); link.click(); document.body.removeChild(link);
        },
        exportPAJSKCSV() {
          const totalSesi = state.perjumpaan.length;
          const headers = ['No Keahlian','Nama Penuh','Kelas','Platun','Jawatan','Bil Hadir','Jumlah Sesi','Peratus (%)','Skor Hadir (40M)','Skor Jawatan (10M)'];
          const rows = state.ahli.map(a => {
            const h = state.kehadiran.filter(k => k.ahli_id === a.id && k.status === 'Hadir').length;
            const pct = totalSesi > 0 ? Math.round((h/totalSesi)*100) : 0;
            const m = totalSesi > 0 ? Math.round((h/totalSesi)*40) : 0;
            return [a.no_keahlian, '"' + a.nama_penuh + '"', a.kelas, a.jantina, a.jawatan, h, totalSesi, pct, m, markahJawatan(a.jawatan)];
          });
          const csv = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
          const link = document.createElement('a');
          link.setAttribute('href', encodeURI(csv));
          link.setAttribute('download', 'Markah_PAJSK_DigitalKrsmSMAI_' + new Date().toISOString().slice(0,10) + '.csv');
          document.body.appendChild(link); link.click(); document.body.removeChild(link);
        },
        setStatus(pjpId, ahliId, st) {
          const idx = state.kehadiran.findIndex(k => k.perjumpaan_id === pjpId && k.ahli_id === ahliId);
          if (idx >= 0) state.kehadiran[idx].status = st;
          else state.kehadiran.push({ id: 'keh-' + Date.now(), perjumpaan_id: pjpId, ahli_id: ahliId, status: st, catatan: '' });
          saveAll(); render();
        },
        setCatatan(pjpId, ahliId, val) {
          const idx = state.kehadiran.findIndex(k => k.perjumpaan_id === pjpId && k.ahli_id === ahliId);
          if (idx >= 0) state.kehadiran[idx].catatan = val;
          else state.kehadiran.push({ id: 'keh-' + Date.now(), perjumpaan_id: pjpId, ahli_id: ahliId, status: 'Hadir', catatan: val });
          saveAll();
        },
        markAllHadir() {
          const filtered = state.ahli.filter(a => (state.selectedKelas === 'SEMUA' || a.kelas === state.selectedKelas) && (state.selectedPlatun === 'SEMUA' || a.jantina === state.selectedPlatun));
          filtered.forEach(a => {
            const idx = state.kehadiran.findIndex(k => k.perjumpaan_id === state.selectedPjpId && k.ahli_id === a.id);
            if (idx >= 0) state.kehadiran[idx].status = 'Hadir';
            else state.kehadiran.push({ id: 'keh-' + Date.now() + a.id, perjumpaan_id: state.selectedPjpId, ahli_id: a.id, status: 'Hadir', catatan: '' });
          });
          saveAll(); render();
        },
        addManualStudents(e) {
          e.preventDefault();
          const kls = document.getElementById('m-kelas').value;
          const plt = document.getElementById('m-platun').value;
          const raw = document.getElementById('m-names').value;
          const lines = raw.split('\n').map(s => s.trim()).filter(Boolean);
          if (!lines.length) return;
          const kObj = KELAS_RASMI.find(x => x.nama === kls);
          lines.forEach((nm, i) => {
            state.ahli.unshift({
              id: 'ahli-' + Date.now() + '-' + i,
              no_keahlian: 'KRSM-' + (state.profile.tahunSesi || '2026') + '-' + String(state.ahli.length + 1).padStart(3, '0'),
              nama_penuh: nm,
              no_kp: '—',
              tingkatan: kObj ? kObj.tingkatan : 1,
              kelas: kls,
              jantina: plt,
              pangkat: 'Kadet',
              jawatan: 'Ahli Biasa',
              no_tel_waris: '—',
              status: 'Aktif'
            });
          });
          document.getElementById('modal-add-student').classList.add('hidden');
          saveAll(); render();
        },
        deleteAhli(id) {
          if (currentUser().peranan !== 'Super Admin') return;
          state.ahli = state.ahli.filter(a => a.id !== id);
          state.kehadiran = state.kehadiran.filter(k => k.ahli_id !== id);

        addLaporan(e) {

          const tempat = document.getElementById('l-tempat').value.trim();

          const ringkasan = document.getElementById('l-ringkasan').value.trim();
          const impak = document.getElementById('l-impak').value.trim();
          const fileInput = document.getElementById('l-images');
          if (!tajuk) return;
          const hadirCount = state.kehadiran.filter(k => k.perjumpaan_id === state.selectedPjpId && k.status === 'Hadir').length;

          const finalizeLap = function(imgs) {
            state.laporan.unshift({
              id: 'lap-' + Date.now(),
              perjumpaan_id: state.selectedPjpId,
              tajuk_laporan: tajuk,
              tarikh: tarikh || new Date().toISOString().slice(0,10),
              masa: '2.30 Petang – 4.30 Petang',
              tempat: tempat || 'Dataran Perhimpunan Sekolah',

              bil_hadir: hadirCount || state.ahli.length,
              bil_keseluruhan: state.ahli.length,
              objektif: objektif || 'Meningkatkan disiplin dan kemahiran asas kadet KRSM.',
              ringkasan: ringkasan || 'Aktiviti dilaksanakan mengikut jadual dengan penyertaan aktif kadet Banin dan Banat.',
              impak_pencapaian: impak || 'Objektif perjumpaan tercapai dengan cemerlang.',
              gambar_eviden: imgs
            });
            document.getElementById('modal-new-lap').classList.add('hidden');
            saveAll(); render();
          };

          if (fileInput && fileInput.files && fileInput.files.length > 0) {
            const files = Array.from(fileInput.files).slice(0, 4);
            const loaded = [];
            files.forEach(f => {
              const r = new FileReader();
              r.onload = function() {
                loaded.push(r.result);
                if (loaded.length === files.length) finalizeLap(loaded);
              };
              r.readAsDataURL(f);
            });
          } else {
            finalizeLap([]);
          }

          state.laporan = state.laporan.filter(l => l.id !== id);
          saveAll(); render();

                    <div class="flex justify-center">${sidebarLogoHtml}</div>
                    <div class="text-xs font-bold uppercase text-[#701F32]">Kadet Remaja Sekolah Musleh (KRSM)</div>
                    <h2 class="text-lg font-bold uppercase">${esc(state.profile.namaSekolah)}</h2>
                    <h1 class="text-3xl font-extrabold text-[#701F32] uppercase">Sijil Penghargaan</h1>
                    <p class="text-xs text-slate-500">Dengan ini diperakui bahawa</p>
                    <div class="text-2xl font-bold underline decoration-[#F2C94C]">${esc(sa.nama_penuh)}</div>
                    <div class="text-xs font-semibold text-slate-600">Kelas: ${esc(sa.kelas)} (Platun ${esc(sa.jantina)})</div>
                    <p class="text-xs text-slate-700 max-w-md mx-auto">Telah menyertai aktiviti kokurikulum KRSM bagi sesi ${esc(state.profile.tahunSesi || '2026')} sebagai <b>${esc(sa.pangkat)} (${esc(sa.jawatan)})</b> dengan rekod kehadiran <b>${pct}%</b>.</p>
                    <div class="pt-6 grid grid-cols-2 gap-6 text-xs">
                      <div><div class="h-8"></div><div class="border-t border-slate-400 pt-1 font-bold">${esc(state.profile.ketuaGuruPenasihat)}</div><div>Ketua Guru Penasihat KRSM</div></div>
                      <div><div class="h-8"></div><div class="border-t border-slate-400 pt-1 font-bold">${esc(state.profile.pengetua)}</div><div>Pengetua</div></div>
                    </div>
                  </div>
                </div>
              </div>`;
          }
        } else if (state.printLapId) {
          const lp = state.laporan.find(l => l.id === state.printLapId);
          if (lp) {
            overlayModals = `
              <div class="fixed inset-0 z-50 bg-slate-900/75 flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
                  <div class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center no-print"><span class="font-bold text-sm">Cetakan Rasmi Laporan Aktiviti</span><div class="space-x-2"><button onclick="window.print()" class="px-3.5 py-1.5 rounded-lg bg-[#28734B] text-xs font-bold">Cetak / PDF</button><button onclick="appAction.closePrintLap()" class="px-2.5 py-1.5 rounded-lg bg-white/10 text-xs">Tutup</button></div></div>
                  <div class="p-8 overflow-y-auto space-y-4 text-xs">
                    <div class="text-center border-b-2 border-[#701F32] pb-3"><div class="font-bold text-[#701F32] uppercase">Kadet Remaja Sekolah Musleh (KRSM)</div><h2 class="text-lg font-bold uppercase">${esc(state.profile.namaSekolah)}</h2></div>
                    <div class="bg-slate-50 p-4 rounded-xl border grid grid-cols-2 gap-2"><div><b>Tajuk:</b> ${esc(lp.tajuk_laporan)}</div><div><b>Tarikh:</b> ${fmtDate(lp.tarikh)}</div><div><b>Tempat:</b> ${esc(lp.tempat)}</div><div><b>Kehadiran:</b> ${lp.bil_hadir}/${lp.bil_keseluruhan}</div></div>
                    <div><h4 class="font-bold text-[#701F32] uppercase">Objektif</h4><p class="mt-1">${esc(lp.objektif)}</p></div>
                    <div><h4 class="font-bold text-[#701F32] uppercase">Ringkasan Aktiviti</h4><p class="mt-1">${esc(lp.ringkasan)}</p></div>
                    <div><h4 class="font-bold text-[#701F32] uppercase">Impak & Pencapaian</h4><p class="mt-1">${esc(lp.impak_pencapaian || '')}</p></div>
                    ${Array.isArray(lp.gambar_eviden) && lp.gambar_eviden.length ? '<div class="grid grid-cols-2 gap-3 pt-2">' + lp.gambar_eviden.map(s => '<img src="' + s + '" class="h-40 w-full object-cover rounded-lg border" />').join('') + '</div>' : ''}
                  </div>
                </div>
              </div>`;
          }
        } else if (state.loginModalOpen) {
          overlayModals = `
            <div class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl border border-slate-200">
                <div class="px-6 py-4 bg-[#701F32] text-white flex justify-between items-center">
                  <h3 class="font-bold text-base">Log Masuk / Tukar Akaun Pentadbir</h3>
                  <button onclick="appAction.closeLoginModal()" class="p-1.5 rounded-lg hover:bg-white/10 text-xs">✕</button>
                </div>
                <form onsubmit="appAction.verifyLogin(event)" class="p-6 space-y-4">
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Pilih Akaun (Super Admin / Admin Guru)</label>
                    <select id="login-user-id" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold bg-white">
                      ${state.admins.map(ad => '<option value="' + ad.id + '" ' + (ad.id === state.currentUserId ? 'selected' : '') + '>[' + esc(ad.peranan) + '] ' + esc(ad.nama) + '</option>').join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Masukkan PIN Keselamatan</label>
                    <input id="login-pin-input" type="password" required placeholder="Contoh: 1234 atau 1111" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-mono" />
                    ${state.loginError ? '<p class="text-xs text-red-600 font-semibold mt-1">' + esc(state.loginError) + '</p>' : ''}
                  </div>
                  <div class="pt-2 flex items-center justify-between gap-2">
                    <button type="button" onclick="appAction.logout()" class="px-3.5 py-2 rounded-xl bg-red-50 text-red-700 text-xs font-bold">Log Keluar</button>
                    <div class="flex gap-2">
                      <button type="button" onclick="appAction.closeLoginModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold">Batal</button>
                      <button type="submit" class="px-5 py-2 rounded-xl bg-[#28734B] text-white text-xs font-bold">Log Masuk</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>`;
        }

        document.getElementById('root').innerHTML = `
          <div class="min-h-screen flex flex-col lg:flex-row">
            <aside class="${state.mobileOpen ? 'fixed inset-0 z-40 flex' : 'hidden'} lg:flex lg:w-72 lg:flex-col lg:fixed lg:inset-y-0 bg-[#701F32] text-white shadow-xl">
              <div class="p-6 border-b border-white/10 flex items-center justify-between">
                <div class="flex items-center gap-3.5">
                  ${sidebarLogoHtml}
                  <div>
                    <h1 class="text-lg font-bold tracking-tight">KRSM DIGITAL</h1>
                    <p class="text-[11px] text-rose-100/80">Kadet Remaja Sekolah Musleh</p>
                  </div>
                </div>
                <button onclick="appAction.toggleMobile()" class="lg:hidden p-2 rounded-lg bg-white/10 text-xs">✕</button>
              </div>
              <nav class="flex-1 px-4 py-5 space-y-1.5">
                ${navs.map(n => `
                  <button onclick="appAction.setTab('${n.id}')" class="w-full text-left px-4 py-3 rounded-xl text-sm transition ${state.tab===n.id ? 'bg-white text-[#701F32] font-bold shadow-md' : 'text-rose-100/85 hover:bg-white/10'}">${n.label}</button>
                `).join('')}
              </nav>
              <div class="p-4 border-t border-white/10 space-y-2">
                <button onclick="appAction.downloadBackup()" class="w-full py-2.5 px-3.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold text-white">Muat Turun Sandaran (.JSON)</button>
                <label class="block w-full py-2.5 px-3.5 rounded-xl bg-[#28734B] hover:bg-[#21613f] text-xs font-semibold text-white text-center cursor-pointer">Pulihkan Data (.JSON)<input type="file" accept=".json" onchange="appAction.restoreBackup(this)" class="hidden" /></label>
                <button onclick="appAction.logout()" class="w-full py-2 px-3.5 rounded-xl bg-red-950/50 hover:bg-red-900 text-xs font-semibold text-rose-200">Log Keluar</button>
              </div>
            </aside>

            <div class="flex-1 lg:pl-72 flex flex-col min-w-0">
              <header class="sticky top-0 z-20 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 sm:px-8 py-4">
                <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                  <div class="flex items-center gap-3">
                    <button onclick="appAction.toggleMobile()" class="lg:hidden px-3 py-2 rounded-xl border text-xs font-bold">☰ Menu</button>
                    <div>
                      <div class="flex items-center gap-2">
                        <span class="px-2.5 py-0.5 rounded-md bg-[#701F32]/10 text-[#701F32] text-xs font-bold">SESI ${esc(state.profile.tahunSesi || '2026')}</span>
                        <span class="text-xs font-semibold text-slate-700">${esc(state.profile.namaSekolah)}</span>
                      </div>
                      <p class="text-xs text-slate-500 mt-0.5">Sistem Pengurusan Kehadiran dan Laporan Aktiviti KRSM Sekolah Menengah</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-2">
                    <button type="button" onclick="appAction.openLoginModal()" class="px-3.5 py-1.5 rounded-full text-xs font-bold border transition cursor-pointer ${isSuper ? 'bg-[#701F32]/10 border-[#701F32]/30 text-[#701F32] hover:bg-[#701F32]/20' : 'bg-amber-50 border-amber-300 text-amber-800 hover:bg-amber-100'}" title="Klik untuk Log Masuk / Tukar Super Admin atau Admin Guru">🔑 ${esc(user.peranan)} (Tukar / Log Masuk)</button>
                    <span class="px-3 py-1.5 rounded-full bg-[#28734B]/10 text-[#28734B] text-xs font-bold">DigitalKrsmSMAI</span>
                  </div>
                </div>
              </header>
              <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-6">${mainContent}</main>
            </div>
          </div>

          ${overlayModals}

          <div id="modal-add-student" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
              <div class="px-6 py-4 bg-[#28734B] text-white flex justify-between items-center"><h3 class="font-bold">Tambah Nama Pelajar</h3><button onclick="document.getElementById('modal-add-student').classList.add('hidden')">✕</button></div>
              <form onsubmit="appAction.addManualStudents(event)" class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-3">
                  <div><label class="block text-xs font-semibold mb-1">Kelas</label><select id="m-kelas" class="w-full px-3 py-2 rounded-xl border text-xs font-bold">${KELAS_RASMI.map(k => '<option value="' + k.nama + '">' + k.nama + '</option>').join('')}</select></div>
                  <div><label class="block text-xs font-semibold mb-1">Platun</label><select id="m-platun" class="w-full px-3 py-2 rounded-xl border text-xs font-bold"><option value="Banin">Banin</option><option value="Banat">Banat</option></select></div>
                </div>
                <div><label class="block text-xs font-semibold mb-1">Nama Pelajar (Satu nama setiap baris)</label><textarea id="m-names" rows="4" required class="w-full px-3 py-2 rounded-xl border text-xs" placeholder="Taip nama pelajar..."></textarea></div>
                <div class="flex justify-end gap-2"><button type="button" onclick="document.getElementById('modal-add-student').classList.add('hidden')" class="px-4 py-2 rounded-xl border text-xs">Batal</button><button type="submit" class="px-5 py-2 rounded-xl bg-[#28734B] text-white text-xs font-bold">Simpan</button></div>
              </form>
            </div>
          </div>

          <div id="modal-new-pjp" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
              <div class="px-6 py-4 bg-[#701F32] text-white flex justify-between items-center"><h3 class="font-bold">Tambah Tarikh Perjumpaan</h3><button onclick="document.getElementById('modal-new-pjp').classList.add('hidden')">✕</button></div>
              <form onsubmit="appAction.addNewPjp(event)" class="p-6 space-y-4">
                <div><label class="block text-xs font-semibold mb-1">Tajuk Aktiviti</label><input id="p-tajuk" required class="w-full px-3 py-2 rounded-xl border text-sm" placeholder="Contoh: Latihan Kawad Kaki" /></div>
                <div class="grid grid-cols-2 gap-3">
                  <div><label class="block text-xs font-semibold mb-1">Tarikh</label><input id="p-tarikh" type="date" required value="${new Date().toISOString().slice(0,10)}" class="w-full px-3 py-2 rounded-xl border text-xs" /></div>
                  <div><label class="block text-xs font-semibold mb-1">Tempat</label><input id="p-tempat" value="Dataran Perhimpunan" class="w-full px-3 py-2 rounded-xl border text-xs" /></div>
                </div>
                <div class="flex justify-end gap-2"><button type="button" onclick="document.getElementById('modal-new-pjp').classList.add('hidden')" class="px-4 py-2 rounded-xl border text-xs">Batal</button><button type="submit" class="px-5 py-2 rounded-xl bg-[#701F32] text-white text-xs font-bold">Cipta Sesi</button></div>
              </form>
            </div>
          </div>

          <div id="modal-new-lap" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
              <div class="px-6 py-4 bg-[#701F32] text-white flex justify-between items-center"><h3 class="font-bold">Bina Laporan Aktiviti</h3><button onclick="document.getElementById('modal-new-lap').classList.add('hidden')">✕</button></div>
              <form onsubmit="appAction.addLaporan(event)" class="p-6 space-y-3 overflow-y-auto">
                <div><label class="block text-xs font-semibold mb-1">Tajuk Laporan</label><input id="l-tajuk" required class="w-full px-3 py-2 rounded-xl border text-sm" /></div>
                <div class="grid grid-cols-2 gap-3">
                  <div><label class="block text-xs font-semibold mb-1">Tarikh</label><input id="l-tarikh" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full px-3 py-2 rounded-xl border text-xs" /></div>
                  <div><label class="block text-xs font-semibold mb-1">Tempat</label><input id="l-tempat" value="Dataran Perhimpunan Sekolah" class="w-full px-3 py-2 rounded-xl border text-xs" /></div>
                </div>
                <div><label class="block text-xs font-semibold mb-1">Objektif Aktiviti</label><textarea id="l-objektif" rows="2" class="w-full px-3 py-2 rounded-xl border text-xs"></textarea></div>
                <div><label class="block text-xs font-semibold mb-1">Ringkasan Aktiviti</label><textarea id="l-ringkasan" rows="2" class="w-full px-3 py-2 rounded-xl border text-xs"></textarea></div>
                <div><label class="block text-xs font-semibold mb-1">Impak & Pencapaian</label><textarea id="l-impak" rows="2" class="w-full px-3 py-2 rounded-xl border text-xs"></textarea></div>
                <div><label class="block text-xs font-semibold mb-1">Gambar Eviden (Maksimum 4 keping)</label><input id="l-images" type="file" accept="image/*" multiple class="w-full text-xs" /></div>
                <div class="flex justify-end gap-2"><button type="button" onclick="document.getElementById('modal-new-lap').classList.add('hidden')" class="px-4 py-2 rounded-xl border text-xs">Batal</button><button type="submit" class="px-5 py-2 rounded-xl bg-[#28734B] text-white text-xs font-bold">Simpan Laporan</button></div>
              </form>
            </div>
          </div>
        `;
      }

      render();
    })();
  </script>
</body>
</html>

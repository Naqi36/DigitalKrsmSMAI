      function fmtDate(d) {
        if (!d) return '—';
        const p = d.split('-');
        if (p.length !== 3) return d;
        const b = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
        return parseInt(p[2],10) + ' ' + (b[parseInt(p[1],10)-1] || p[1]) + ' ' + p[0];
      }

        exportAhliCSV() {

          link.setAttribute('href', encodeURI(csv));

          document.body.appendChild(link); link.click(); document.body.removeChild(link);
        },
        exportPAJSKCSV() {

          const headers = ['No Keahlian','Nama Penuh','Kelas','Platun','Jawatan','Bil Hadir','Jumlah Sesi','Peratus (%)','Skor Hadir (40M)'];
          const rows = state.ahli.map(a => {
            const h = state.kehadiran.filter(k => k.ahli_id === a.id && k.status === 'Hadir').length;
            const pct = totalSesi > 0 ? Math.round((h/totalSesi)*100) : 0;
            const m = totalSesi > 0 ? Math.round((h/totalSesi)*40) : 0;

          link.setAttribute('href', encodeURI(csv));

          document.body.appendChild(link); link.click(); document.body.removeChild(link);
        },
        setStatus(pjpId, ahliId, st) {
          const idx = state.kehadiran.findIndex(k => k.perjumpaan_id === pjpId && k.ahli_id === ahliId);
          if (idx >= 0) state.kehadiran[idx].status = st;
          else state.kehadiran.push({ id: 'keh-' + Date.now(), perjumpaan_id: pjpId, ahli_id: ahliId, status: st, catatan: '' });
          saveAll(); render();
        },
        setCatatan(pjpId, ahliId, val) {
          const idx = state.kehadiran.findIndex(k => k.perjumpaan_id === pjpId && k.ahli_id === ahliId);
          if (idx >= 0) state.kehadiran[idx].catatan = val;
          else state.kehadiran.push({ id: 'keh-' + Date.now(), perjumpaan_id: pjpId, ahli_id: ahliId, status: 'Hadir', catatan: val });
          saveAll();
        },
        markAllHadir() {
          const filtered = state.ahli.filter(a => (state.selectedKelas === 'SEMUA' || a.kelas === state.selectedKelas) && (state.selectedPlatun === 'SEMUA' || a.jantina === state.selectedPlatun));
          filtered.forEach(a => {
            const idx = state.kehadiran.findIndex(k => k.perjumpaan_id === state.selectedPjpId && k.ahli_id === a.id);

            else state.kehadiran.push({ id: 'keh-' + Date.now() + a.id, perjumpaan_id: state.selectedPjpId, ahli_id: a.id, status: 'Hadir', catatan: '' });
          });
          saveAll(); render();

          const raw = document.getElementById('m-names').value;
          const lines = raw.split('\n').map(s => s.trim()).filter(Boolean);
          if (!lines.length) return;
          const kObj = KELAS_RASMI.find(x => x.nama === kls);

            state.ahli.unshift({
              id: 'ahli-' + Date.now() + '-' + i,
              no_keahlian: 'KRSM-' + (state.profile.tahunSesi || '2026') + '-' + String(state.ahli.length + 1).padStart(3, '0'),

              status: 'Aktif'

          });

          e.preventDefault();

          e.preventDefault();
          const tarikh = document.getElementById('pn-tarikh').value;

            saveAll(); render();
